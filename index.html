<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi de tâches : Communication — EUT-UGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eff3ea;
    --card:#ffffff;
    --ink:#19283f;
    --muted:#5c6b78;
    --line:#dbe1d6;
    --accent:#e35d54;
    --accent-dark:#19283f;
    --danger:#e35d54;
    --danger-soft:#f7e3e1;
    --warn:#e56843;
    --warn-soft:#fbe4d8;
    --ok:#009f6f;
    --ok-soft:#deefe4;
    --neutral-soft:#eef1ea;
    --p1-bg:#bcd4f0; --p1-ink:#19283f;
    --p2-bg:#9dcb8f; --p2-ink:#19283f;
    --p3-bg:#bfe2e0; --p3-ink:#19283f;
    --p4-bg:#f5a266; --p4-ink:#19283f;
    --p5-bg:#f1e967; --p5-ink:#19283f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Verdana, Geneva, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:24px 16px 60px;
  }
  h1, .brand-word, .export-btn, .tab, .add-row, .field-label{
    font-family:'Poppins', Verdana, sans-serif;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:16px;flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-mark{display:flex;align-items:center;}
  .brand-mark .eut-logo{width:100px;height:auto;display:block;}
  .brand-divider{width:1px;height:42px;background:var(--line);}
  h1{font-size:1.3rem;margin:0 0 4px;font-weight:700;color:var(--ink);}
  .subtitle{color:var(--muted);font-size:.83rem;}
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .year-input{font-size:.83rem;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .year-input input{
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:76px;
    font-family:inherit;font-size:.83rem;background:var(--card);color:var(--ink);
  }
  .export-btn{
    display:flex;align-items:center;gap:6px;border:none;background:var(--accent-dark);
    color:#fff;border-radius:6px;padding:9px 16px;font-size:.78rem;font-weight:700;
    cursor:pointer;letter-spacing:.02em;text-transform:uppercase;
  }
  .export-btn:hover{background:var(--accent);}
  .save-btn{
    display:flex;align-items:center;gap:6px;border:1px solid var(--accent-dark);
    background:var(--card);color:var(--accent-dark);border-radius:6px;padding:9px 16px;
    font-size:.78rem;font-weight:700;cursor:pointer;letter-spacing:.02em;text-transform:uppercase;
    font-family:'Poppins', Verdana, sans-serif;
  }
  .save-btn:hover{background:var(--neutral-soft);}
  .save-btn.just-saved{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .util-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;}
  .util-link{
    color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;
    font-size:.75rem;text-decoration:underline;padding:0;
  }
  .util-link:hover{color:var(--accent-dark);}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .tab{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:20px;padding:6px 13px;font-size:.74rem;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .tab:hover{border-color:var(--accent-dark);color:var(--accent-dark);}
  .tab.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
  .tab .badge{background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px;font-size:.68rem;}
  .tab.active .badge{background:rgba(255,255,255,.25);}
  .tab.all{border-style:dashed;border-color:var(--accent);color:var(--accent);}
  .tab.all.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .task-list{display:flex;flex-direction:column;gap:10px;}
  .task-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;box-shadow:0 1px 2px rgba(25,40,63,.05);
  }
  .task-card.done{background:#f8f9f6;}
  .task-card.overdue{border-left:4px solid var(--danger);}
  .overdue-badge{
    display:inline-block;margin-left:6px;font-size:.65rem;font-weight:700;color:var(--danger);
    background:var(--danger-soft);border-radius:10px;padding:2px 7px;text-transform:uppercase;
    letter-spacing:.02em;vertical-align:middle;font-family:'Poppins', Verdana, sans-serif;
  }
  .task-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .checkbox{
    width:19px;height:19px;border:1.5px solid var(--line);border-radius:5px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:#fff;flex-shrink:0;margin-top:2px;
  }
  .checkbox.checked{background:var(--ok);border-color:var(--ok);color:#fff;font-size:.7rem;}
  .task-text-wrap{flex:1;min-width:0;}
  input[type=text].task-text{
    width:100%;border:1px solid transparent;background:transparent;font-weight:700;
    font-family:'Poppins', Verdana, sans-serif;font-size:.95rem;color:var(--ink);
    padding:4px 6px;border-radius:6px;
  }
  .task-card.done .task-text{text-decoration:line-through;color:var(--muted);}
  input[type=text], input[type=date]{
    border:1px solid transparent;background:transparent;font-family:inherit;
    font-size:.85rem;color:var(--ink);padding:5px 6px;border-radius:6px;width:100%;
  }
  input[type=text]:hover, input[type=date]:hover{background:var(--neutral-soft);}
  input[type=text]:focus, input[type=date]:focus{
    outline:none;border:1px solid var(--accent-dark);background:#fff;
  }
  .del-btn{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:1.05rem;opacity:.45;padding:3px;flex-shrink:0;
  }
  .del-btn:hover{opacity:1;color:var(--danger);}

  .task-meta{display:flex;flex-wrap:wrap;gap:10px 14px;margin-bottom:6px;}
  .field{display:flex;flex-direction:column;gap:2px;min-width:96px;}
  .field-label{
    font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:700;padding-left:2px;
  }
  .field select, .field input[type=date]{padding:5px 8px;}
  select{
    border:none;border-radius:20px;padding:5px 10px;font-size:.72rem;
    font-family:'Poppins', Verdana, sans-serif;font-weight:700;cursor:pointer;
    appearance:none;-webkit-appearance:none;padding-right:20px;
    text-transform:uppercase;letter-spacing:.01em;
  }
  select.status-todo{background-color:var(--neutral-soft);color:var(--ink);}
  select.status-progress{background-color:var(--warn-soft);color:var(--warn);}
  select.status-done{background-color:var(--ok-soft);color:var(--ok);}
  select.status-blocked{background-color:var(--danger-soft);color:var(--danger);}
  select.p-haute{color:var(--danger);background-color:var(--danger-soft);}
  select.p-moyenne{color:var(--warn);background-color:var(--warn-soft);}
  select.p-basse{color:var(--ok);background-color:var(--ok-soft);}
  select.tag-empty{background-color:var(--neutral-soft);color:var(--muted);}
  select.month-select{background-color:var(--p1-bg);color:var(--p1-ink);}
  .field.date-field input{
    border:1px solid var(--line);border-radius:8px;background:var(--neutral-soft);
    font-size:.78rem;font-weight:600;color:var(--ink);
  }
  .task-notes{margin-top:2px;}
  .task-notes input{
    font-size:.82rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;
  }
  .task-notes input:focus{color:var(--ink);}

  .subtasks-wrap{margin-top:6px;}
  .subtasks-toggle{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:.76rem;
    font-weight:700;padding:2px 2px;font-family:'Poppins', Verdana, sans-serif;
    text-transform:uppercase;letter-spacing:.02em;
  }
  .subtasks-toggle:hover{color:var(--accent-dark);}
  .subtasks-list{
    margin-top:6px;padding-left:4px;border-left:2px solid var(--line);
    display:flex;flex-direction:column;gap:4px;
  }
  .subtask-row{display:flex;align-items:center;gap:8px;padding-left:8px;}
  .sub-checkbox{width:15px;height:15px;font-size:.6rem;}
  .subtask-text{
    flex:1;font-size:.82rem;border:1px solid transparent;background:transparent;
    padding:3px 5px;border-radius:5px;color:var(--ink);
  }
  .subtask-text:hover{background:var(--neutral-soft);}
  .subtask-text:focus{outline:none;border-color:var(--accent-dark);background:#fff;}
  .subtask-text.done{text-decoration:line-through;color:var(--muted);}
  .sub-del{font-size:.85rem;opacity:.4;padding:2px;}
  .sub-del:hover{opacity:1;}
  .subtask-add{
    align-self:flex-start;margin-left:8px;margin-top:2px;background:none;border:none;
    color:var(--accent-dark);cursor:pointer;font-size:.78rem;font-weight:700;
    padding:3px 4px;font-family:'Poppins', Verdana, sans-serif;
  }
  .subtask-add:hover{color:var(--accent);}

  .add-row{
    display:flex;align-items:center;gap:8px;color:var(--accent-dark);
    font-size:.82rem;font-weight:700;cursor:pointer;background:var(--card);
    border:1px dashed var(--line);border-radius:8px;padding:10px 14px;
    text-transform:uppercase;letter-spacing:.02em;width:100%;justify-content:center;
    margin-top:4px;
  }
  .add-row:hover{color:var(--accent);border-color:var(--accent);}

  .footer-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:16px;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);
  }
  .stats{display:flex;gap:14px;flex-wrap:wrap;}
  .stat b{color:var(--ink);}
  .reset-btn{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:6px;padding:6px 12px;font-family:inherit;font-size:.78rem;cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--danger);color:var(--danger);}
  .empty-hint{
    padding:24px;text-align:center;color:var(--muted);font-size:.85rem;
    background:var(--card);border:1px dashed var(--line);border-radius:10px;
  }
  .save-hint{font-size:.72rem;color:var(--ok);opacity:.85;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(25,40,63,.4);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:10px;width:320px;max-width:90vw;padding:18px;
    box-shadow:0 8px 30px rgba(25,40,63,.25);border-top:4px solid var(--accent);
  }
  .modal h3{margin:0 0 4px;font-size:.95rem;font-family:'Poppins',sans-serif;color:var(--ink);}
  .modal .modal-sub{font-size:.75rem;color:var(--muted);margin-bottom:12px;}
  .tag-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .tag-row input{
    flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;
    font-family:inherit;font-size:.83rem;background:var(--neutral-soft);
  }
  .tag-row input:focus{outline:none;border-color:var(--accent-dark);background:#fff;}
  .tag-row button{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:.9rem;opacity:.6;padding:4px;
  }
  .tag-row button:hover{opacity:1;color:var(--danger);}
  .modal-add{display:flex;gap:6px;margin-top:10px;}
  .modal-add input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:.83rem;}
  .modal-add button{
    border:none;background:var(--accent-dark);color:#fff;border-radius:6px;
    padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer;
  }
  .modal-add button:hover{background:var(--accent);}
  .modal-close{
    margin-top:14px;width:100%;border:1px solid var(--line);background:#fff;
    border-radius:6px;padding:7px;font-size:.82rem;cursor:pointer;color:var(--ink);
  }
  .modal-close:hover{background:var(--neutral-soft);}

  .nature-gear-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .gear-link{
    display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:5px 12px;cursor:pointer;font-family:'Poppins',sans-serif;font-weight:600;
  }
  .gear-link:hover{color:var(--accent-dark);border-color:var(--accent-dark);}

  .filters-bar{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;
  }
  .filters-bar input[type=text]{
    flex:1 1 160px;min-width:120px;border:1px solid var(--line);background:var(--card);
    border-radius:8px;padding:7px 10px;font-size:.82rem;
  }
  .filters-bar input[type=text]:focus{outline:none;border-color:var(--accent-dark);}
  .filters-bar select{
    background-color:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:.74rem;text-transform:none;
  }
  .filters-reset{
    color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;
    font-size:.75rem;text-decoration:underline;padding:0;
  }
  .filters-reset:hover{color:var(--accent-dark);}

  .upcoming-banner{display:none;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .banner-chip{
    border:none;border-radius:16px;padding:6px 13px;font-size:.76rem;font-weight:700;
    cursor:pointer;font-family:'Poppins', Verdana, sans-serif;letter-spacing:.01em;
  }
  .overdue-chip{background:var(--danger-soft);color:var(--danger);}
  .upcoming-chip{background:var(--warn-soft);color:var(--warn);}
  .banner-chip.active{outline:2px solid currentColor;}
  .clear-chip{background:var(--neutral-soft);color:var(--muted);}

  .dup-btn{font-size:.95rem;}

  .done-toggle{
    display:block;width:100%;text-align:center;background:var(--card);
    border:1px dashed var(--line);border-radius:8px;padding:9px;margin-top:6px;
    color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;
    font-family:'Poppins', Verdana, sans-serif;text-transform:uppercase;letter-spacing:.02em;
  }
  .done-toggle:hover{color:var(--accent-dark);border-color:var(--accent-dark);}

  .access-gate{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .access-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:28px 26px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 8px 30px rgba(25,40,63,.15);
  }
  .access-card .eut-logo{width:70px;margin:0 auto 12px;}
  .access-card h2{font-family:'Poppins',sans-serif;color:var(--ink);margin:0 0 6px;font-size:1.1rem;}
  .access-card p{color:var(--muted);font-size:.82rem;margin:0 0 16px;}
  .access-card input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:.9rem;margin-bottom:10px;text-align:center;box-sizing:border-box;
  }
  .access-card button{
    width:100%;border:none;background:var(--accent-dark);color:#fff;border-radius:8px;
    padding:10px;font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;
    text-transform:uppercase;letter-spacing:.02em;font-size:.82rem;
  }
  .access-card button:hover{background:var(--accent);}
  .access-error{color:var(--danger);font-size:.78rem;margin-top:8px;min-height:1em;}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;font-family:Verdana, sans-serif;padding:10px;}
    #printArea h1{font-size:1.3rem;margin:0 0 2px;font-family:'Poppins',sans-serif;color:#19283f;}
    #printArea .p-sub{color:#555;font-size:.8rem;margin-bottom:14px;}
    #printArea table{width:100%;border-collapse:collapse;font-size:.78rem;}
    #printArea th, #printArea td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;}
    #printArea th{background:#19283f;color:#fff;}
    #printArea tr.p-done td{color:#888;}
    #printArea .p-stats{margin-top:12px;font-size:.8rem;color:#555;}
  }

  /* mobile / narrow screens */
  @media (max-width: 640px){
    body{padding:14px 10px 60px;}
    .wrap{max-width:100%;}
    header{flex-direction:column;align-items:flex-start;gap:12px;}
    .brand{gap:10px;}
    .brand-mark .eut-logo{width:64px;}
    .brand-divider{display:none;}
    h1{font-size:1.1rem;}
    .subtitle{font-size:.78rem;}
    .header-right{width:100%;flex-direction:column;align-items:stretch;gap:8px;}
    .year-input{justify-content:space-between;width:100%;}
    .year-input input{flex:0 0 76px;}
    .save-btn, .export-btn{width:100%;justify-content:center;}
    .tabs{gap:5px;margin-bottom:12px;}
    .tab{padding:5px 10px;font-size:.7rem;}
    .nature-gear-row{gap:8px;}
    .gear-link{font-size:.7rem;padding:5px 10px;}
    .task-card{padding:10px 10px;}
    .task-top{flex-wrap:wrap;row-gap:6px;}
    .task-text-wrap{flex:1 1 100%;order:1;}
    .task-top .checkbox{order:0;}
    .task-top select{order:2;}
    .task-top .dup-btn, .task-top .del-btn{order:3;}
    .task-top .dup-btn{margin-left:auto;}
    .filters-bar{flex-direction:column;align-items:stretch;}
    .filters-bar select{width:100%;}
    .task-meta{gap:8px 10px;}
    .field{flex:1 1 calc(50% - 10px);min-width:0;}
    .field select, .field input{width:100%;}
    .footer-bar{flex-direction:column;align-items:flex-start;gap:10px;}
    .util-row{gap:10px;}
    .reset-btn{width:100%;}
  }
</style>
</head>
<body>

    <h2>Accès protégé</h2>
    <p>Entrez le code d'accès pour ouvrir le suivi de tâches.</p>
    <input type="password" id="accessPinInput" placeholder="Code d'accès">
    <button id="accessSubmitBtn">Continuer</button>
    <div class="access-error" id="accessError"></div>
  </div>
</div>

<script>

  {v:8, label:'Septembre'}, {v:9, label:'Octobre'}, {v:10, label:'Novembre'}, {v:11, label:'Décembre'},

  {v:4, label:'Mai'}, {v:5, label:'Juin'}, {v:6, label:'Juillet'}, {v:7, label:'Août'}
];
const MONTH_LABEL = Object.fromEntries(MONTHS.map(m => [m.v, m.label]));

const PRIORITIES = [
  {v:'basse', label:'Basse'}, {v:'moyenne', label:'Moyenne'}, {v:'haute', label:'Haute'}
];
const STATUSES = [
  {v:'todo', label:'À faire'}, {v:'progress', label:'En cours'},
  {v:'blocked', label:'Bloquée'}, {v:'done', label:'Terminée'}
];

const PILLAR_PALETTE = [
  {bg:'#bcd4f0', ink:'#19283f'}, {bg:'#9dcb8f', ink:'#19283f'}, {bg:'#bfe2e0', ink:'#19283f'},
  {bg:'#f5a266', ink:'#19283f'}, {bg:'#f1e967', ink:'#19283f'}
];

let tagLists = { nature: ['Graphisme', 'Web'], demandeur: ['ENEPS', 'BUT+', 'RSE'] };

const now = new Date();
const currentRealMonth = now.getMonth();
let yearStart = currentRealMonth >= 8 ? now.getFullYear() : now.getFullYear() - 1;

function todayISO(){ return new Date().toISOString().slice(0,10); }

function academicYearOf(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
}

function genSubId(){ return 'st' + Date.now() + Math.floor(Math.random() * 10000); }

let tasks = [
  {id:1, text:'Relancer maquette page d\'accueil', nature:'Web', demandeur:'BUT+', prio:'haute', status:'progress', mois: currentRealMonth, annee: yearStart, debut: todayISO(), due:'', notes:'', completedAt:null, subtasks:[], subtasksOpen:false},
  {id:2, text:'Préparer support de réunion', nature:'Graphisme', demandeur:'RSE', prio:'moyenne', status:'todo', mois: currentRealMonth, annee: yearStart, debut: todayISO(), due:'', notes:'', completedAt:null, subtasks:[], subtasksOpen:false},
  {id:3, text:'Envoyer compte-rendu semaine dernière', nature:'', demandeur:'ENEPS', prio:'basse', status:'done', mois: currentRealMonth, annee: yearStart, debut: todayISO(), due:'', notes:'', completedAt: todayISO(), subtasks:[], subtasksOpen:false}
];
let nextId = 4;
let activeMonth = 'all';
let searchQuery = '';
let filterNature = '';
let filterDemandeur = '';
let filterStatus = '';
let quickFilter = null; // null | 'upcoming' | 'overdue'
let doneCollapsedOpen = false;
const DONE_COLLAPSE_DAYS = 7;

// ⚠️ CONFIGURATION — à remplir avec vos identifiants Supabase (Settings > API)
const SUPABASE_URL = 'https://ehxlamvxfojdfxwzxyac.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoeGxhbXZ4Zm9qZGZ4d3p4eWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzM5MDMsImV4cCI6MjEwNDE0OTkwM30.wGeAF5ppzB-xb3Vte1KmpkY2ldZhoKrKnl56F74w9y4';
const STATE_ID = 'main'; // identifiant fixe de la ligne (un seul enregistrement pour tout le tableau)

// ⚠️ Optionnel : définissez un code d'accès pour protéger cette page.
// Laissez 'CHANGEZ-MOI' pour désactiver la protection.
const ACCESS_PIN = 'CHANGEZ-MOI';

function checkAccess(){
  if(!ACCESS_PIN || ACCESS_PIN === 'CHANGEZ-MOI' || sessionStorage.getItem('eut_access_ok') === 'true'){
    document.getElementById('accessGate').style.display = 'none';
  }
}
document.getElementById('accessSubmitBtn').onclick = () => {
  const val = document.getElementById('accessPinInput').value;
  if(val === ACCESS_PIN){
    sessionStorage.setItem('eut_access_ok', 'true');
    document.getElementById('accessGate').style.display = 'none';
  } else {
    document.getElementById('accessError').textContent = 'Code incorrect.';
  }
};
document.getElementById('accessPinInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('accessSubmitBtn').click();
});
checkAccess();

const IS_CONFIGURED = !SUPABASE_URL.includes('VOTRE-PROJET') && !SUPABASE_ANON_KEY.includes('VOTRE_CLE');

function supabaseHeaders(extra){
  return Object.assign({
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`
  }, extra || {});
}

const STORAGE_KEY = 'suivi-annuel-data';
let saveTimer = null;

async function loadState(){
  if(!IS_CONFIGURED){
    showConfigBanner();
    document.getElementById('yearStart').value = yearStart;
    renderTabs();
    render();
    return;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.${STATE_ID}&select=data`, {
      headers: supabaseHeaders()
    });
    const rows = await res.json();
    if(Array.isArray(rows) && rows[0] && rows[0].data){
      const data = rows[0].data;
      if(data.tasks) tasks = data.tasks;
      if(data.tagLists) tagLists = data.tagLists;
      if(typeof data.nextId === 'number') nextId = data.nextId;
      if(typeof data.yearStart === 'number') yearStart = data.yearStart;
      if(data.activeMonth !== undefined) activeMonth = data.activeMonth;
    }
  }catch(err){
    console.error('Chargement Supabase impossible :', err);
  }
  tasks.forEach(t => {
    if(typeof t.annee !== 'number'){ t.annee = academicYearOf(t.debut) ?? yearStart; }
    if(!Array.isArray(t.subtasks)) t.subtasks = [];
    if(typeof t.subtasksOpen !== 'boolean') t.subtasksOpen = false;
  });
  renderYearOptions();
  renderTabs();
  render();
}

function showConfigBanner(){
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#fbe4d8;border:1px solid #e56843;color:#19283f;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.82rem;';
  banner.innerHTML = '⚠️ Supabase non configuré — vos données ne seront pas sauvegardées tant que <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code> ne sont pas renseignés dans le fichier.';
  document.querySelector('.wrap').insertBefore(banner, document.querySelector('.tabs'));
}

async function doSave(){
  const hint = document.getElementById('saveHint');
  if(!IS_CONFIGURED){
    hint.textContent = 'Supabase non configuré';
    return false;
  }
  try{
    const payload = {id: STATE_ID, data: {tasks, tagLists, nextId, yearStart, activeMonth}, updated_at: new Date().toISOString()};
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
      method: 'POST',
      headers: supabaseHeaders({'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'}),
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('Échec de la sauvegarde (' + res.status + ')');
    hint.textContent = 'Enregistré';
    setTimeout(() => { hint.textContent = ''; }, 1500);
    return true;
  }catch(err){
    console.error('Sauvegarde Supabase impossible :', err);
    hint.textContent = 'Enregistrement impossible';
    return false;
  }
}

function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 250);
}

async function forceSave(){
  clearTimeout(saveTimer);
  const btn = document.getElementById('saveBtn');
  const ok = await doSave();
  if(ok){
    btn.textContent = '✓ Enregistré';
    btn.classList.add('just-saved');
  } else {
    btn.textContent = '⚠ Échec';
  }
  setTimeout(() => {
    btn.textContent = '💾 Enregistrer';
    btn.classList.remove('just-saved');
  }, 1800);
}
document.getElementById('saveBtn').onclick = forceSave;

function exportJson(){
  const data = {tasks, tagLists, nextId, yearStart, activeMonth};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `suivi-taches-eut-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('exportJsonBtn').onclick = exportJson;

document.getElementById('importJsonBtn').onclick = () => document.getElementById('importJsonInput').click();
document.getElementById('importJsonInput').onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!confirm('Remplacer les données actuelles par celles de ce fichier ?')) return;
      if(data.tasks) tasks = data.tasks;
      if(data.tagLists) tagLists = data.tagLists;
      if(typeof data.nextId === 'number') nextId = data.nextId;
      if(typeof data.yearStart === 'number'){ yearStart = data.yearStart; }
      if(data.activeMonth !== undefined) activeMonth = data.activeMonth;
      tasks.forEach(t => {
        if(typeof t.annee !== 'number'){ t.annee = academicYearOf(t.debut) ?? yearStart; }
        if(!Array.isArray(t.subtasks)) t.subtasks = [];
        if(typeof t.subtasksOpen !== 'boolean') t.subtasksOpen = false;
      });
      renderYearOptions();
      renderTabs(); render(); saveState();
    }catch(err){
      alert('Fichier invalide.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

function renderTabs(){
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  const yearTasks = tasks.filter(t => t.annee === yearStart);
  const allTab = document.createElement('button');
  allTab.className = 'tab all' + (activeMonth === 'all' && !quickFilter ? ' active' : '');
  allTab.innerHTML = `Toutes <span class="badge">${yearTasks.length}</span>`;
  allTab.onclick = () => { activeMonth = 'all'; quickFilter = null; renderTabs(); render(); saveState(); };
  bar.appendChild(allTab);
  MONTHS.forEach(m => {
    const count = yearTasks.filter(t => t.mois === m.v).length;
    const tab = document.createElement('button');
    tab.className = 'tab' + (activeMonth === m.v && !quickFilter ? ' active' : '');
    tab.innerHTML = `${m.label} <span class="badge">${count}</span>`;
    tab.onclick = () => { activeMonth = m.v; quickFilter = null; renderTabs(); render(); saveState(); };
    bar.appendChild(tab);
  });
}

const PRIO_RANK = {haute:0, moyenne:1, basse:2};

function sortByPriority(list){
  return [...list].sort((a, b) => {
    const aDone = a.status === 'done', bDone = b.status === 'done';
    if(aDone !== bDone) return aDone ? 1 : -1;

    const aDue = a.due, bDue = b.due;
    if(aDue && bDue){ if(aDue !== bDue) return aDue < bDue ? -1 : 1; }
    else if(aDue && !bDue) return -1;
    else if(!aDue && bDue) return 1;

    const pr = (PRIO_RANK[a.prio] ?? 1) - (PRIO_RANK[b.prio] ?? 1);
    if(pr !== 0) return pr;
    return 0;
  });
}

function isOverdue(t){
  return t.due && t.status !== 'done' && t.due < todayISO();
}

function addDaysISO(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function daysSince(iso){
  if(!iso) return -1;
  const d = new Date(iso + 'T00:00:00');
  const t = new Date(todayISO() + 'T00:00:00');
  return Math.round((t - d) / 86400000);
}

function matchesFilters(t){
  if(filterNature && t.nature !== filterNature) return false;
  if(filterDemandeur && t.demandeur !== filterDemandeur) return false;
  if(filterStatus && t.status !== filterStatus) return false;
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    const hay = (t.text + ' ' + (t.notes || '')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function baseFiltered(){
  let list;
  if(quickFilter === 'overdue'){
    list = tasks.filter(t => isOverdue(t));
  } else if(quickFilter === 'upcoming'){
    const today = todayISO();
    const in7 = addDaysISO(today, 7);
    list = tasks.filter(t => t.due && t.status !== 'done' && t.due >= today && t.due <= in7);
  } else {
    list = tasks.filter(t => t.annee === yearStart);
    if(activeMonth !== 'all') list = list.filter(t => t.mois === activeMonth);
  }
  return list.filter(matchesFilters);
}

function visibleTasks(){
  return sortByPriority(baseFiltered());
}

function updateBanner(){
  const banner = document.getElementById('upcomingBanner');
  const today = todayISO();
  const in7 = addDaysISO(today, 7);
  const overdueCount = tasks.filter(t => isOverdue(t)).length;
  const upcomingCount = tasks.filter(t => t.due && t.status !== 'done' && t.due >= today && t.due <= in7).length;
  banner.innerHTML = '';
  if(overdueCount === 0 && upcomingCount === 0 && !quickFilter){
    banner.style.display = 'none';
    return;
  }
  banner.style.display = 'flex';
  if(overdueCount > 0){
    const b = document.createElement('button');
    b.className = 'banner-chip overdue-chip' + (quickFilter === 'overdue' ? ' active' : '');
    b.textContent = `⚠ ${overdueCount} en retard`;
    b.onclick = () => { quickFilter = quickFilter === 'overdue' ? null : 'overdue'; renderTabs(); render(); };
    banner.appendChild(b);
  }
  if(upcomingCount > 0){
    const b = document.createElement('button');
    b.className = 'banner-chip upcoming-chip' + (quickFilter === 'upcoming' ? ' active' : '');
    b.textContent = `⏳ ${upcomingCount} sous 7 jours`;
    b.onclick = () => { quickFilter = quickFilter === 'upcoming' ? null : 'upcoming'; renderTabs(); render(); };
    banner.appendChild(b);
  }
  if(quickFilter){
    const clear = document.createElement('button');
    clear.className = 'banner-chip clear-chip';
    clear.textContent = '✕ Effacer le filtre';
    clear.onclick = () => { quickFilter = null; renderTabs(); render(); };
    banner.appendChild(clear);
  }
}

function fillFilterSelect(sel, values, current, allLabel){
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = allLabel;
  sel.appendChild(optAll);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
  sel.value = values.includes(current) ? current : '';
}

function renderFilterOptions(){
  fillFilterSelect(document.getElementById('filterNature'), tagLists.nature, filterNature, 'Toutes natures');
  fillFilterSelect(document.getElementById('filterDemandeur'), tagLists.demandeur, filterDemandeur, 'Tous demandeurs');
}

document.getElementById('searchInput').oninput = e => { searchQuery = e.target.value; render(); };
document.getElementById('filterNature').onchange = e => { filterNature = e.target.value; render(); };
document.getElementById('filterDemandeur').onchange = e => { filterDemandeur = e.target.value; render(); };
document.getElementById('filterStatus').onchange = e => { filterStatus = e.target.value; render(); };
document.getElementById('filtersResetBtn').onclick = () => {
  searchQuery = ''; filterNature = ''; filterDemandeur = ''; filterStatus = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('filterStatus').value = '';
  renderFilterOptions();
  render();
};

function render(){
  renderYearOptions();
  renderFilterOptions();
  updateBanner();
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const vis = visibleTasks();
  if(vis.length === 0){
    list.innerHTML = '<div class="empty-hint">Aucune tâche pour cette période — cliquez sur « Ajouter une tâche » pour commencer.</div>';
  } else {
    const recent = [];
    const oldDone = [];
    vis.forEach(t => {
      if(t.status === 'done' && t.completedAt && daysSince(t.completedAt) > DONE_COLLAPSE_DAYS){
        oldDone.push(t);
      } else {
        recent.push(t);
      }
    });
    if(recent.length === 0 && oldDone.length > 0){
      list.innerHTML = '<div class="empty-hint">Toutes les tâches de cette période sont terminées depuis plus d\'une semaine.</div>';
    } else {
      recent.forEach(t => list.appendChild(buildCard(t)));
    }
    if(oldDone.length > 0){
      const toggle = document.createElement('button');
      toggle.className = 'done-toggle';
      toggle.textContent = (doneCollapsedOpen ? '▾ ' : '▸ ') + `Terminées il y a plus de ${DONE_COLLAPSE_DAYS} jours (${oldDone.length})`;
      toggle.onclick = () => { doneCollapsedOpen = !doneCollapsedOpen; render(); };
      list.appendChild(toggle);
      if(doneCollapsedOpen){
        oldDone.forEach(t => list.appendChild(buildCard(t)));
      }
    }
  }
  updateStats(vis);
}

function setStatus(t, newStatus){
  if(newStatus === 'done' && t.status !== 'done'){ t.completedAt = todayISO(); }
  if(newStatus !== 'done'){ t.completedAt = null; }
  t.status = newStatus;
}

function pillarColorFor(field, value){
  if(!value) return null;
  const idx = tagLists[field].indexOf(value);
  if(idx === -1) return null;
  return PILLAR_PALETTE[idx % PILLAR_PALETTE.length];
}

function buildTagSelect(t, field){
  const sel = document.createElement('select');
  const optEmpty = document.createElement('option');
  optEmpty.value = ''; optEmpty.textContent = '—';
  if(!t[field]) optEmpty.selected = true;
  sel.appendChild(optEmpty);
  tagLists[field].forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    if(t[field] === v) opt.selected = true;
    sel.appendChild(opt);
  });
  const color = pillarColorFor(field, t[field]);
  if(color){ sel.style.backgroundColor = color.bg; sel.style.color = color.ink; }
  else { sel.className = 'tag-empty'; }
  sel.onchange = e => { t[field] = e.target.value; render(); saveState(); };
  return sel;
}

function field(labelText, control){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('span');
  lab.className = 'field-label';
  lab.textContent = labelText;
  wrap.appendChild(lab);
  wrap.appendChild(control);
  return wrap;
}

function buildCard(t){
  const card = document.createElement('div');
  card.className = 'task-card' + (t.status === 'done' ? ' done' : '') + (isOverdue(t) ? ' overdue' : '');

  const top = document.createElement('div');
  top.className = 'task-top';

  const cb = document.createElement('div');
  cb.className = 'checkbox' + (t.status === 'done' ? ' checked' : '');
  cb.textContent = t.status === 'done' ? '✓' : '';
  cb.onclick = () => { setStatus(t, t.status === 'done' ? 'todo' : 'done'); render(); renderTabs(); saveState(); };
  top.appendChild(cb);

  const textWrap = document.createElement('div');
  textWrap.className = 'task-text-wrap';
  const inpText = document.createElement('input');
  inpText.type = 'text';
  inpText.className = 'task-text';
  inpText.value = t.text;
  inpText.placeholder = 'Décrire la tâche…';
  inpText.oninput = e => { t.text = e.target.value; saveState(); };
  textWrap.appendChild(inpText);
  if(isOverdue(t)){
    const badge = document.createElement('span');
    badge.className = 'overdue-badge';
    badge.textContent = '⚠ En retard';
    textWrap.appendChild(badge);
  }
  top.appendChild(textWrap);

  const selPrio = document.createElement('select');
  selPrio.className = 'p-' + t.prio;
  PRIORITIES.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.v; opt.textContent = p.label;
    if(p.v === t.prio) opt.selected = true;
    selPrio.appendChild(opt);
  });
  selPrio.onchange = e => { t.prio = e.target.value; render(); saveState(); };
  top.appendChild(selPrio);

  const dupBtn = document.createElement('button');
  dupBtn.className = 'del-btn dup-btn';
  dupBtn.textContent = '⧉';
  dupBtn.title = 'Dupliquer cette tâche';
  dupBtn.onclick = () => {
    const copiedSubtasks = (t.subtasks || []).map(s => ({id: genSubId(), text: s.text, done:false}));
    const copy = Object.assign({}, t, {id: nextId++, status:'todo', completedAt:null, debut: todayISO(), due:'', subtasks: copiedSubtasks, subtasksOpen: t.subtasksOpen});
    const idx = tasks.indexOf(t);
    tasks.splice(idx + 1, 0, copy);
    renderTabs(); render(); saveState();
  };
  top.appendChild(dupBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.textContent = '✕';
  delBtn.title = 'Supprimer';
  delBtn.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); renderTabs(); render(); saveState(); };
  top.appendChild(delBtn);

  card.appendChild(top);

  const meta = document.createElement('div');
  meta.className = 'task-meta';

  meta.appendChild(field('Nature', buildTagSelect(t, 'nature')));
  meta.appendChild(field('Demandeur', buildTagSelect(t, 'demandeur')));

  const selStatus = document.createElement('select');
  selStatus.className = 'status-' + t.status;
  STATUSES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.v; opt.textContent = s.label;
    if(s.v === t.status) opt.selected = true;
    selStatus.appendChild(opt);
  });
  selStatus.onchange = e => { setStatus(t, e.target.value); render(); renderTabs(); saveState(); };
  meta.appendChild(field('Statut', selStatus));

  const selMonth = document.createElement('select');
  selMonth.className = 'month-select';
  MONTHS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.v; opt.textContent = m.label;
    if(t.mois === m.v) opt.selected = true;
    selMonth.appendChild(opt);
  });
  selMonth.onchange = e => { t.mois = parseInt(e.target.value, 10); renderTabs(); render(); saveState(); };
  meta.appendChild(field('Mois', selMonth));

  const inpDebut = document.createElement('input');
  inpDebut.type = 'date';
  inpDebut.value = t.debut || '';
  inpDebut.oninput = e => {
    t.debut = e.target.value;
    if(e.target.value){
      t.mois = new Date(e.target.value + 'T00:00:00').getMonth();
      t.annee = academicYearOf(e.target.value);
    }
    renderYearOptions(); renderTabs(); render(); saveState();
  };
  const fDebut = field('Début', inpDebut);
  fDebut.classList.add('date-field');
  meta.appendChild(fDebut);

  const inpDue = document.createElement('input');
  inpDue.type = 'date';
  inpDue.value = t.due;
  inpDue.oninput = e => { t.due = e.target.value; saveState(); };
  const fDue = field('Échéance', inpDue);
  fDue.classList.add('date-field');
  meta.appendChild(fDue);

  card.appendChild(meta);

  // subtasks (checklist)
  const subWrap = document.createElement('div');
  subWrap.className = 'subtasks-wrap';
  if(!Array.isArray(t.subtasks)) t.subtasks = [];

  const subToggle = document.createElement('button');
  subToggle.className = 'subtasks-toggle';
  const subDone = t.subtasks.filter(s => s.done).length;
  const subTotal = t.subtasks.length;
  subToggle.textContent = subTotal > 0
    ? `${t.subtasksOpen ? '▾' : '▸'} Sous-tâches (${subDone}/${subTotal})`
    : `${t.subtasksOpen ? '▾' : '▸'} Sous-tâches`;
  subToggle.onclick = () => { t.subtasksOpen = !t.subtasksOpen; render(); saveState(); };
  subWrap.appendChild(subToggle);

  if(t.subtasksOpen){
    const subList = document.createElement('div');
    subList.className = 'subtasks-list';

    t.subtasks.forEach(s => {
      const row = document.createElement('div');
      row.className = 'subtask-row';

      const subCb = document.createElement('div');
      subCb.className = 'checkbox sub-checkbox' + (s.done ? ' checked' : '');
      subCb.textContent = s.done ? '✓' : '';
      subCb.onclick = () => { s.done = !s.done; render(); saveState(); };
      row.appendChild(subCb);

      const subInp = document.createElement('input');
      subInp.type = 'text';
      subInp.className = 'subtask-text' + (s.done ? ' done' : '');
      subInp.value = s.text;
      subInp.placeholder = 'Décrire la sous-tâche…';
      subInp.setAttribute('data-subtask-id', s.id);
      subInp.oninput = e => { s.text = e.target.value; saveState(); };
      row.appendChild(subInp);

      const subDel = document.createElement('button');
      subDel.className = 'del-btn sub-del';
      subDel.textContent = '✕';
      subDel.title = 'Supprimer cette sous-tâche';
      subDel.onclick = () => {
        t.subtasks = t.subtasks.filter(x => x.id !== s.id);
        render(); saveState();
      };
      row.appendChild(subDel);

      subList.appendChild(row);
    });

    const subAddBtn = document.createElement('button');
    subAddBtn.className = 'subtask-add';
    subAddBtn.textContent = '+ Ajouter une sous-tâche';
    subAddBtn.onclick = () => {
      const newId = genSubId();
      t.subtasks.push({id: newId, text:'', done:false});
      t.subtasksOpen = true;
      render(); saveState();
      const newInp = document.querySelector(`[data-subtask-id="${newId}"]`);
      if(newInp) newInp.focus();
    };
    subList.appendChild(subAddBtn);

    subWrap.appendChild(subList);
  }

  card.appendChild(subWrap);

  // notes row
  const notesWrap = document.createElement('div');
  notesWrap.className = 'task-notes';
  const inpNotes = document.createElement('input');
  inpNotes.type = 'text';
  inpNotes.value = t.notes;
  inpNotes.placeholder = 'Notes…';
  inpNotes.oninput = e => { t.notes = e.target.value; saveState(); };
  notesWrap.appendChild(inpNotes);
  card.appendChild(notesWrap);

  return card;
}

function updateStats(vis){
  document.getElementById('statTotal').textContent = vis.length;
  document.getElementById('statDone').textContent = vis.filter(t => t.status === 'done').length;
  document.getElementById('statBlocked').textContent = vis.filter(t => t.status === 'blocked').length;
}

document.getElementById('addBtn').onclick = () => {
  const mois = activeMonth === 'all' ? currentRealMonth : activeMonth;
  tasks.push({id: nextId++, text:'', nature:'', demandeur:'', prio:'moyenne', status:'todo', mois: mois, annee: yearStart, debut: todayISO(), due:'', notes:'', completedAt:null, subtasks:[], subtasksOpen:false});
  renderTabs(); render(); saveState();
  const inputs = document.querySelectorAll('.task-text');
  if(inputs.length) inputs[inputs.length - 1].focus();
};

document.getElementById('resetBtn').onclick = () => {
  if(confirm('Vider entièrement le tableau (toute l\'année) ?')){
    tasks = []; nextId = 1; renderTabs(); render(); saveState();
  }
};

function renderYearOptions(){
  const sel = document.getElementById('yearStart');
  const years = new Set();
  for(let y = yearStart - 4; y <= yearStart + 3; y++) years.add(y);
  tasks.forEach(t => { if(typeof t.annee === 'number') years.add(t.annee); });
  const sorted = Array.from(years).sort((a, b) => a - b);
  sel.innerHTML = '';
  sorted.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = `${y}-${y + 1}`;
    if(y === yearStart) opt.selected = true;
    sel.appendChild(opt);
  });
}

document.getElementById('yearStart').onchange = e => {
  yearStart = parseInt(e.target.value, 10);
  renderTabs(); render(); saveState();
};

let currentField = null;

function openModal(f){
  currentField = f;
  document.getElementById('modalTitle').textContent = f === 'nature' ? 'Gérer : Nature de la tâche' : 'Gérer : Demandeur';
  renderModalList();
  document.getElementById('modalNewValue').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); currentField = null; }

function renderModalList(){
  const list = document.getElementById('modalList');
  list.innerHTML = '';
  tagLists[currentField].forEach((val, idx) => {
    const row = document.createElement('div');
    row.className = 'tag-row';
    const color = PILLAR_PALETTE[idx % PILLAR_PALETTE.length];
    const swatch = document.createElement('span');
    swatch.style.cssText = `display:inline-block;width:14px;height:14px;border-radius:4px;background:${color.bg};flex-shrink:0;`;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = val;
    inp.onchange = e => {
      const newVal = e.target.value.trim();
      if(!newVal) { e.target.value = val; return; }
      const oldVal = tagLists[currentField][idx];
      tagLists[currentField][idx] = newVal;
      tasks.forEach(t => { if(t[currentField] === oldVal) t[currentField] = newVal; });
      render(); saveState();
    };
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.title = 'Supprimer cette valeur';
    delBtn.onclick = () => {
      const oldVal = tagLists[currentField][idx];
      tagLists[currentField].splice(idx, 1);
      tasks.forEach(t => { if(t[currentField] === oldVal) t[currentField] = ''; });
      renderModalList(); render(); saveState();
    };
    row.appendChild(swatch); row.appendChild(inp); row.appendChild(delBtn);
    list.appendChild(row);
  });
}

document.querySelectorAll('.gear-link').forEach(btn => { btn.onclick = () => openModal(btn.dataset.manage); });
document.getElementById('modalCloseBtn').onclick = closeModal;
document.getElementById('modalOverlay').onclick = e => { if(e.target.id === 'modalOverlay') closeModal(); };
document.getElementById('modalAddBtn').onclick = () => {
  const inp = document.getElementById('modalNewValue');
  const val = inp.value.trim();
  if(!val) return;
  if(!tagLists[currentField].includes(val)) tagLists[currentField].push(val);
  inp.value = ''; renderModalList(); saveState();
};
document.getElementById('modalNewValue').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('modalAddBtn').click(); });

const STATUS_LABEL = Object.fromEntries(STATUSES.map(s => [s.v, s.label]));
const PRIO_LABEL = Object.fromEntries(PRIORITIES.map(p => [p.v, p.label]));

function yearForMonth(m){ return m >= 8 ? yearStart : yearStart + 1; }

function buildPrintReport(){
  const vis = visibleTasks();
  const periodLabel = activeMonth === 'all'
    ? `Année universitaire ${yearStart}-${yearStart + 1}`
    : `${MONTH_LABEL[activeMonth]} ${yearForMonth(activeMonth)}`;
  const generated = new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

  let rows = vis.map(t => `
    <tr class="${t.status === 'done' ? 'p-done' : ''}">
      <td>${escapeHtml(t.text) || '—'}</td>
      <td>${escapeHtml(t.nature) || '—'}</td>
      <td>${escapeHtml(t.demandeur) || '—'}</td>
      <td>${PRIO_LABEL[t.prio] || '—'}</td>
      <td>${STATUS_LABEL[t.status] || '—'}</td>
      <td>${MONTH_LABEL[t.mois] || '—'}</td>
      <td>${t.debut ? new Date(t.debut + 'T00:00:00').toLocaleDateString('fr-FR') : '—'}</td>
      <td>${t.due ? new Date(t.due + 'T00:00:00').toLocaleDateString('fr-FR') : '—'}</td>
      <td>${escapeHtml(t.notes) || '—'}${(t.subtasks && t.subtasks.length) ? ' [Sous-tâches : ' + t.subtasks.filter(s => s.done).length + '/' + t.subtasks.length + ']' : ''}</td>
    </tr>
  `).join('');

  if(vis.length === 0){ rows = '<tr><td colspan="9">Aucune tâche.</td></tr>'; }

  const done = vis.filter(t => t.status === 'done').length;
  const blocked = vis.filter(t => t.status === 'blocked').length;

  document.getElementById('printArea').innerHTML = `
    <h1>EUT — État des lieux des tâches</h1>
    <div class="p-sub">${periodLabel} — édité le ${generated}</div>
    <table>
      <thead>
        <tr><th>Tâche</th><th>Nature</th><th>Demandeur</th><th>Priorité</th><th>Statut</th><th>Mois</th><th>Début</th><th>Échéance</th><th>Notes</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="p-stats">${vis.length} tâche(s) — ${done} terminée(s) — ${blocked} bloquée(s)</div>
  `;
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('exportBtn').onclick = () => { buildPrintReport(); window.print(); };

loadState();
</script>
